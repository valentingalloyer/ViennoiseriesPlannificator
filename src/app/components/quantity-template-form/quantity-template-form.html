<form class="quantity-form" (ngSubmit)="onSubmit()">
    <label for="qty-person">Nombre de personnes : </label>
    <input id="qty-person" name="qty-person" [(ngModel)]="qtyPerson" type="number" placeholder="Nombre de personnes"/>
    <label for="ratio-voracite">Ratio de voracité : </label>
    <input id="ratio-voracite" name="ratio-voracite" [(ngModel)]="ratioVoracite" type="number" placeholder="Ratio de voracité"/>
    <button type="submit">Calculer les quantités</button>
</form>
